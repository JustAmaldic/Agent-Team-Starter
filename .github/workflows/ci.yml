name: ATS checks
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q ats.py scripts tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate clean public export
        shell: bash
        run: |
          python scripts/export_public.py --output "${{ runner.temp }}/ats-public-review"
          test ! -e "${{ runner.temp }}/ats-public-review/data"
          test ! -e "${{ runner.temp }}/ats-public-review/.git"
          test -f "${{ runner.temp }}/ats-public-review/README.md"
